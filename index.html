<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آية</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* الخلفية الرومانسية مع الصورة والأيدي */
        .bg_heart {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            z-index: 1;
        }

        /* طبقة مظلمة خفيفة لتوضيح الكتابة */
        .bg_heart::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* صندوق النص */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        /* النص العربي الرومانسي */
        .container h2 {
            color: #fff;
            font-size: 28px;
            line-height: 1.6;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin: 0;
            font-weight: bold;
            animation: fadeIn 2s ease-in-out;
        }

        /* حركة تطاير القلوب */
        .heart {
            position: absolute;
            top: 100%;
            background-color: #ff2a55;
            display: inline-block;
            height: 30px;
            margin: 0 10px;
            transform: rotate(-45deg);
            width: 30px;
            animation: love 8s infinite linear;
            opacity: 0.8;
            z-index: 2;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: #ff2a55;
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart:before {
            top: -15px;
            left: 0;
        }

        .heart:after {
            left: 15px;
            top: 0;
        }

        @keyframes love {
            0% { top: 110%; transform: rotate(-45deg) translate(0, 0) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            100% { top: -20%; transform: rotate(-45deg) translate(-100px, -400px) scale(1.2); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg_heart" id="bg_heart"></div>

    <div class="container">
        <h2 id="text1">من شفتج لأول مرة.. عرفت إنو إنتي شي خاص ومميز بـ حياتي. أحبج آية ❤️</h2>
    </div>

    <script>
        // كود الجافاسكريبت المسؤول عن توليد القلوب العشوائية في الخلفية
        function createHearts() {
            const bg = document.getElementById('bg_heart');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // أحجام وأماكن عشوائية للقلوب
                const size = Math.random() * 20 + 15;
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                
                // تعديل زوايا القلوب العشوائية
                const before = heart.style;
                
                bg.appendChild(heart);
                
                // مسح القلب بعد ما يطير وينتهي ستايله حتى ميثقل الصفحة
                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }, 300);
        }

        window.onload = createHearts;
    </script>

</body>
</html>
