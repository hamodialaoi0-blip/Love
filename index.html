<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آية</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        img {
            width: 150px;
            margin-bottom: 20px;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://media.tenor.com/w9g_1VsyZ6QAAAAi/peach-goma.gif" alt="Cute Cats">
        <h1>آية تحبيني لو لا؟ 🥺❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">إي 🥰</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لا 😢</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // توليد أماكن عشوائية للزر حتى يهرب داخل الشاشة
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            alert('أدري والله! وأني هم أحبج موت 💖😘');
        }
    </script>

</body>
</html>
